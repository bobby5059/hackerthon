[project]
name = "table-order-backend"
version = "0.1.0"
description = "Table Order Service — backend-api (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "pyjwt>=2.9,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "hypothesis>=6.112,<7.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F(pyflakes/pycodestyle), I(isort), B(bugbear), UP(pyupgrade), S(bandit-security)
select = ["E", "F", "I", "B", "UP", "S"]
# S101: assert 허용(pytest). 테스트 디렉토리에서 완화(아래 per-file-ignores).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
